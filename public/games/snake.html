<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNAKE // MATRIX CYBERPUNK - TARS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #00f0ff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h1 {
      font-size: 24px;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow: 0 0 15px #00f0ff;
      margin-bottom: 12px;
    }
    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 2px solid #00f0ff;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.3), inset 0 0 20px rgba(0, 240, 255, 0.1);
      background: rgba(5, 10, 20, 0.9);
      position: relative;
    }
    canvas {
      border: 1px solid rgba(0, 240, 255, 0.4);
      background: #02040a;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 10px;
    }
    .stat-val {
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 8px #00f0ff;
    }
    .controls {
      margin-top: 15px;
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
    }
    kbd {
      background: #1e293b;
      color: #00f0ff;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(0, 240, 255, 0.3);
    }
    .game-over-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      display: none;
      border-radius: 12px;
    }
    .btn {
      background: #00f0ff;
      color: #000;
      border: none;
      padding: 10px 20px;
      font-family: inherit;
      font-weight: bold;
      font-size: 14px;
      letter-spacing: 2px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <h1>⚡ TARS // SERPIENTE MATRIX</h1>
  <div class="game-container">
    <div class="hud">
      <div>PUNTOS: <span id="score" class="stat-val">0</span></div>
      <div>RECORD: <span id="high-score" class="stat-val">0</span></div>
    </div>
    <canvas id="snake" width="400" height="400"></canvas>
    <div id="game-over" class="game-over-overlay">
      <h2 style="font-size:32px; color:#ff0055; text-shadow:0 0 20px #ff0055; letter-spacing:4px;">GAME OVER</h2>
      <p style="margin-top:10px; color:#fff;">Puntos: <span id="final-score" style="color:#00f0ff; font-weight:bold;">0</span></p>
      <button class="btn" onclick="resetGame()">VOLVER A JUGAR</button>
    </div>
  </div>
  <div class="controls">
    Usa las flechas <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> o <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> para controlar la serpiente
  </div>

  <script>
    const canvas = document.getElementById('snake');
    const ctx = canvas.getContext('2d');
    const GRID = 20;
    const COUNT = canvas.width / GRID;

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioCtx();

    function beep(f, d) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.setValueAtTime(f, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + d);
    }

    let snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
    let food = {x: 15, y: 10};
    let dx = 1;
    let dy = 0;
    let score = 0;
    let highScore = 0;
    let isGameOver = false;

    function randomFood() {
      return {
        x: Math.floor(Math.random() * COUNT),
        y: Math.floor(Math.random() * COUNT)
      };
    }

    function gameLoop() {
      if (isGameOver) return;
      setTimeout(() => {
        requestAnimationFrame(gameLoop);
      }, 95);

      const head = {x: snake[0].x + dx, y: snake[0].y + dy};

      // Wrap edges
      if (head.x < 0) head.x = COUNT - 1;
      else if (head.x >= COUNT) head.x = 0;
      if (head.y < 0) head.y = COUNT - 1;
      else if (head.y >= COUNT) head.y = 0;

      // Check self-collision
      for (let segment of snake) {
        if (segment.x === head.x && segment.y === head.y) {
          isGameOver = true;
          document.getElementById('final-score').innerText = score;
          document.getElementById('game-over').style.display = 'flex';
          beep(130, 0.4);
          return;
        }
      }

      snake.unshift(head);

      // Check food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        if (score > highScore) highScore = score;
        document.getElementById('score').innerText = score;
        document.getElementById('high-score').innerText = highScore;
        food = randomFood();
        beep(580, 0.1);
      } else {
        snake.pop();
      }

      // Draw
      ctx.fillStyle = '#02040a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Food
      ctx.fillStyle = '#ff0055';
      ctx.shadowColor = '#ff0055';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID/2, food.y * GRID + GRID/2, GRID/2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Snake
      snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? '#00f0ff' : '#00aaee';
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = index === 0 ? 15 : 6;
        ctx.fillRect(part.x * GRID + 1, part.y * GRID + 1, GRID - 2, GRID - 2);
      });
      ctx.shadowBlur = 0;
    }

    function resetGame() {
      snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
      dx = 1; dy = 0;
      score = 0;
      isGameOver = false;
      food = randomFood();
      document.getElementById('score').innerText = 0;
      document.getElementById('game-over').style.display = 'none';
      gameLoop();
    }

    document.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd'].includes(k)) {
        e.preventDefault();
      }
      if ((k === 'arrowup' || k === 'w') && dy === 0) { dx = 0; dy = -1; }
      else if ((k === 'arrowdown' || k === 's') && dy === 0) { dx = 0; dy = 1; }
      else if ((k === 'arrowleft' || k === 'a') && dx === 0) { dx = -1; dy = 0; }
      else if ((k === 'arrowright' || k === 'd') && dx === 0) { dx = 1; dy = 0; }
    });

    gameLoop();
  </script>
</body>
</html>
